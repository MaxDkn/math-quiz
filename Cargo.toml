[package]
name = "math-quiz"
authors = ["Max Deckmyn"]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MaxDkn/math-quiz"
description = "The goal is to create an interactive quiz of mathematics, using wasm to get only static files."

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6.5"
rand = { version = "0.9.2", default-features = false, features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
num-traits = "0.2.19"

[lib]
crate-type = ["cdylib", "rlib"]
