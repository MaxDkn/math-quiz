<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathQuiz</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    :root {
      --button-color-1: #FFCDB2;
      --button-color-2: #FFB4A2;
      --button-color-3: #E5989B;
      --button-color-4: #B5828C;
      --question-bg: #f9f9f9;
      --question-text: #000;
      --question-border: #000;
      --popup-bg: #ffffff;
      --popup-text: #000000;
    }

    html[data-bs-theme="dark"] {
      --button-color-1: #09122C;
      --button-color-2: #872341;
      --button-color-3: #BE3144;
      --button-color-4: #E17564;
      --question-bg: #242323;
      --question-text: #fff;
      --question-border: #fff;
      --popup-bg: #333;
      --popup-text: #fff;
    }

    body { height: 100vh; overflow: hidden; background-color: var(--bs-body-bg); }

    .main-container { display: flex; flex-direction: column; height: 100vh; padding: 1rem; }

    .question-box {
      border: 2px solid var(--question-border);
      padding: 20px;
      margin: 10px;
      font-weight: bold;
      background-color: var(--question-bg);
      color: var(--question-text);
      font-size: calc(1.2rem + 1vw);
      border-radius: 12px;
      transition: opacity 0.2s;
    }

    .answers-container { flex: 1; margin: 20px 10px; display: flex; flex-direction: column; gap: 15px; }
    .answer-row { display: flex; flex: 1; gap: 15px; }
    .answer-col { flex: 1; }

    .btn-answer {
      width: 100%;
      height: 100%;
      font-size: calc(1rem + 0.6vw);
      border: none;
      color: var(--question-text);
      background-color: var(--btn-bg);
      transition: transform 0.1s, filter 0.2s;
      border-radius: 10px;
    }

    .btn-answer:hover {
      background-color: var(--btn-bg) !important;
      transform: scale(1.02);
    }

    .btn-answer:active { transform: scale(0.98); }

    .popup-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(142, 22, 22, 0.6);
      display: flex; justify-content: center; align-items: center;
      z-index: 1050; cursor: pointer; visibility: hidden; opacity: 0;
      transition: opacity 0.2s linear;
    }

    .popup-overlay.show { visibility: visible; opacity: 1; }
    .popup-content {
      background-color: var(--popup-bg); color: var(--popup-text);
      padding: 30px; border-radius: 15px; text-align: center;
      box-shadow: 0px 10px 30px rgba(0,0,0,0.3); max-width: 500px; width: 85%;
    }
  </style>
</head>
<body>

<div class="container main-container">
  <div id="question-text" class="question-box text-center">Initialisation du moteur mathématique...</div>

  <div id="answers-grid" class="answers-container">
  </div>
</div>

<div id="error-popup" class="popup-overlay" onclick="closePopup()">
  <div class="popup-content">
    <h3 style="color: #dc3545; font-weight: bold;">Oups !</h3>
    <p id="popup-message" class="fs-4"></p>
    <hr>
    <small class="text-muted">Appuyez n'importe où pour continuer</small>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<script type="module">
  import init, { init_rng, generate } from './pkg/math_quiz.js';

  let currentQuestionData = null;
  const COLORS = ["--button-color-1", "--button-color-2", "--button-color-3", "--button-color-4"];

  async function run() {
    await init();
    init_rng(BigInt(Date.now()));
    loadNewQuestion();
  }

  function renderLatex(element, text) {
    element.innerHTML = "";
    const parts = text.split(/(\$[^$]+\$)/g);
    parts.forEach(part => {
      if (part.startsWith("$") && part.endsWith("$")) {
        const span = document.createElement("span");
        try {
          katex.render(part.slice(1, -1), span, { throwOnError: false });
          element.appendChild(span);
        } catch (e) { element.appendChild(document.createTextNode(part)); }
      } else if (part.length > 0) {
        element.appendChild(document.createTextNode(part));
      }
    });
  }

  function loadNewQuestion() {
    const rawData = generate();
    currentQuestionData = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;

    const questionBox = document.getElementById('question-text');
    const grid = document.getElementById('answers-grid');

    questionBox.style.opacity = 0;

    setTimeout(() => {
      renderLatex(questionBox, currentQuestionData.text);
      generateAnswerButtons(grid, currentQuestionData.answers);
      questionBox.style.opacity = 1;
    }, 150);
  }

  // ... (Garder le reste du code identique)

  function generateAnswerButtons(container, answers) {
    container.innerHTML = "";
    const shuffledColors = [...COLORS].sort(() => Math.random() - 0.5);

    // On s'assure que answers est bien un tableau (cas des enums Serde)
    const answersArray = Array.isArray(answers) ? answers : Object.values(answers)[0];

    // Création des lignes
    for (let i = 0; i < answersArray.length; i += 2) {
      const row = document.createElement('div');
      row.className = 'answer-row';

      for (let j = i; j < i + 2 && j < answersArray.length; j++) {
        const col = document.createElement('div');
        col.className = 'answer-col';

        const btn = document.createElement('button');
        btn.className = 'btn btn-answer';
        btn.style.setProperty('--btn-bg', `var(${shuffledColors[j % shuffledColors.length]})`);

        const span = document.createElement('span');

        // --- ADAPTATION POUR LES BOOLÉENS ---
        let displayValue = answersArray[j];
        if (typeof displayValue === "boolean") {
          displayValue = displayValue ? "Vrai" : "Faux";
        }
        // ------------------------------------

        renderLatex(span, String(displayValue));
        btn.appendChild(span);

        btn.onclick = () => checkAnswer(j);

        col.appendChild(btn);
        row.appendChild(col);
      }
      container.appendChild(row);
    }
  }

  window.checkAnswer = (index) => {
    if (index === currentQuestionData.index_answer) {
      // Optionnel : petit feedback visuel de succès avant la suite
      loadNewQuestion();
    } else {
      const popup = document.getElementById('error-popup');
      const msg = document.getElementById('popup-message');

      // Récupération de la valeur de la bonne réponse
      const answersArray = Array.isArray(currentQuestionData.answers)
              ? currentQuestionData.answers
              : Object.values(currentQuestionData.answers)[0];

      let correctVal = answersArray[currentQuestionData.index_answer];
      if (typeof correctVal === "boolean") correctVal = correctVal ? "Vrai" : "Faux";

      msg.innerHTML = "La bonne réponse était : ";
      const span = document.createElement('span');
      renderLatex(span, String(correctVal));
      msg.appendChild(span);

      popup.classList.add('show');
    }
  };

  window.closePopup = () => {
    document.getElementById('error-popup').classList.remove('show');
    loadNewQuestion();
  };

  // 5. Thème
  function updateTheme() {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
  updateTheme();

  // Démarrage
  run();
</script>
</body>
</html>
