<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Math Quiz WASM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
</head>
<body class="bg-light">

<div id="app" class="container py-5 text-center"></div>

<script type="module">
  import init, { init_rng, generate } from "./pkg/math_quiz.js";

  let currentQuestion = 0;
  let score = 0;
  const totalQuestions = 10;
  const appDiv = document.getElementById("app");

  async function run() {
    await init();
    init_rng(BigInt(Date.now()));
    showStartScreen();
  }

  function clearApp() {
    appDiv.innerHTML = "";
  }

  function parseMathText(text, container) {
    container.innerHTML = "";
    const parts = text.split(/(\$[^$]+\$)/g);
    parts.forEach(part => {
      if (part.startsWith("$") && part.endsWith("$")) {
        const span = document.createElement("span");
        katex.render(part.slice(1,-1), span, { throwOnError: false, strict: false });
        container.appendChild(span);
      } else {
        container.appendChild(document.createTextNode(part));
      }
    });
  }

  function showStartScreen() {
    clearApp();

    const title = document.createElement("h1");
    title.className = "mb-4";
    title.innerText = "Math Quiz";

    const btn = document.createElement("button");
    btn.className = "btn btn-primary btn-lg";
    btn.innerText = "Commencer le jeu";
    btn.onclick = () => {
      score = 0;
      currentQuestion = 0;
      showGameScreen();
    };

    appDiv.appendChild(title);
    appDiv.appendChild(btn);
  }

  function showGameScreen() {
    clearApp();
    currentQuestion++;
    const question = generate();

    const titleDiv = document.createElement("h2");
    titleDiv.className = "mb-4";
    parseMathText(question.text, titleDiv);
    appDiv.appendChild(titleDiv);

    const answersDiv = document.createElement("div");
    answersDiv.className = "row row-cols-2 g-3 justify-content-center";
    appDiv.appendChild(answersDiv);

    let answersArray = [];
    if (question.answers.Close) {
      answersArray = question.answers.Close.map(b => b ? "Oui" : "Non");
    } else if (question.answers.Open) {
      answersArray = question.answers.Open;
    }

    answersArray.forEach((ans, i) => {
      const col = document.createElement("div");
      col.className = "col d-flex";

      const btn = document.createElement("button");
      btn.className = "btn btn-outline-primary flex-fill";
      btn.style.fontSize = "1.2rem";
      parseMathText(ans, btn);
      btn.onclick = () => {
        if (i === question.index_answer) score++;
        if (currentQuestion < totalQuestions) {
          showGameScreen();
        } else {
          showEndScreen();
        }
      };

      col.appendChild(btn);
      answersDiv.appendChild(col);
    });
  }

  function showEndScreen() {
    clearApp();

    const title = document.createElement("h1");
    title.className = "mb-4";
    title.innerText = `Score final : ${score} / ${totalQuestions}`;

    const btn = document.createElement("button");
    btn.className = "btn btn-success btn-lg";
    btn.innerText = "Rejouer";
    btn.onclick = showStartScreen;

    appDiv.appendChild(title);
    appDiv.appendChild(btn);
  }

  run();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
